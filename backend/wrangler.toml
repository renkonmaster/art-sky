# Cloudflare Workers の設定（docs/deploy-workers.md）。
#   pnpm cf:dev       ローカルで動かす（アカウント不要。D1 もローカルのファイル）
#   pnpm cf:deploy    デプロイする
name = "art-sky"
main = "src/cloudflare.ts"
compatibility_date = "2026-10-15"

# 画面（frontend をビルドしたもの）。API などのパスだけ Worker が受け、それ以外は静的ファイルを返す。
# 画面のパス（/u/... など）は index.html を返す。
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/xrpc/*", "/oauth/*", "/client-metadata.json", "/jwks.json"]

[[d1_databases]]
binding = "DB"
database_name = "art-sky"
# wrangler d1 create art-sky で作ったデータベース
database_id = "53f02af7-df2b-4e73-9a60-d84b41f9372a"
migrations_dir = "migrations"

# 1 分ごとに投稿を取り込み、ジョブを処理する（src/cron.ts）
[triggers]
crons = ["* * * * *"]

[vars]
TZ_NAME = "Asia/Tokyo"
# 公開する URL。OAuth のクライアント ID になるので、変えると全員がログインし直しになる。
# ローカル（pnpm cf:dev）では .dev.vars に PUBLIC_URL= を書いて空にし、ループバッククライアントで動かす。
PUBLIC_URL = "https://art-sky.renkon.workers.dev"
# COOKIE_SECRET は wrangler secret put COOKIE_SECRET で設定する（ローカルでは .dev.vars に書く）。

# ログをダッシュボード（art-sky → Logs）に残す。無料プランで 1 日 20 万件まで。
[observability]
enabled = true
